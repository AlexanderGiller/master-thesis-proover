stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/
    - .venv/

# ── Shared setup ────────────────────────────────────────────────────
.python-base:
  image: python:3.12
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -r requirements-dev.txt

# ── Lint jobs ────────────────────────────────────────────────────────
flake8:
  extends: .python-base
  stage: lint
  script:
    - flake8 src/ tests/
  allow_failure: false

black:
  extends: .python-base
  stage: lint
  script:
    - black --check src/ tests/
  allow_failure: false

isort:
  extends: .python-base
  stage: lint
  script:
    - isort --check-only src/ tests/
  allow_failure: false

# ── Test job ─────────────────────────────────────────────────────────
pytest:
  extends: .python-base
  stage: test
  script:
    - pytest
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 1 week